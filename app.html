<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gestão de Metrologia · Perpec Oilfield Supply</title>
<link rel="stylesheet" href="style.css">
<script src="logo.js"></script>
</head>
<body>

<!-- Cortina: some só depois da sessão confirmada. -->
<div class="gate" id="gate">
  <div class="carregando"><div class="spin"></div>Verificando acesso…</div>
</div>

<div class="sticky-top">
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo"><img id="logo" alt="Perpec Oilfield Supply"></div>
      <div class="header-titulo">
        <div class="title" id="appNome">Gestão de Metrologia</div>
        <div class="sub"  id="appSub">Controle de calibração de instrumentos</div>
      </div>
      <div class="header-usuario">
        <div class="quem">
          <span class="nome" id="usuarioNome">—</span>
          <span class="papel" id="usuarioPapel"></span>
        </div>
        <button class="btn-sair" id="btSair" title="Encerrar a sessão">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Sair
        </button>
      </div>
    </div>
  </header>

  <!-- Faixa preta: identidade Perpec e o estado do sistema num lugar só. -->
  <div class="doc-strip">
    <div class="doc-strip-inner">
      <span class="doc-code-label">Documento</span><span class="doc-code-val" id="docRef">—</span>
      <span class="sep"></span>
      <!-- Só aparece quando há problema. Sistema saudável é silencioso. -->
      <span class="conn" id="conexao"><span class="dot"></span><span id="conexaoTxt"></span></span>
      <span class="doc-meta" id="relogio">—</span>
    </div>
  </div>

  <nav class="tabs"><div class="tabs-inner" id="nav"></div></nav>
</div>

<main class="wrap">
  <div id="tela"></div>
  <div class="page-footer">
    <span id="ftEmpresa">Perpec Oilfield Supply</span> — <span id="ftDoc"></span>
  </div>
</main>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast"></div>

<script type="module">
import { CONFIG } from './config.js';
import { exigirSessao, vigiarSessao, sair, perfil, souAdmin } from './auth.js';
import { carregarConfig, ouvir, listarInstrumentos } from './supabase.js';
import { montarNav, iniciarRouter, contadorNav } from './router.js';
import { p2, toast, msgErro } from './utils.js';

/* ---- Identidade da tela ---- */
document.getElementById('docRef').textContent    = CONFIG.DOC_REF;
document.getElementById('ftDoc').textContent     = CONFIG.DOC_REF;
document.getElementById('ftEmpresa').textContent = CONFIG.EMPRESA;
document.getElementById('appNome').textContent   = CONFIG.APP_NOME;
document.getElementById('appSub').textContent    = CONFIG.APP_SUB;
document.title = CONFIG.APP_NOME + ' · ' + CONFIG.EMPRESA;
if (window.LOGO_B64) document.getElementById('logo').src = window.LOGO_B64;
else document.getElementById('logo').closest('.header-logo').remove();

/* ---- Relógio: estado do sistema sempre visível ---- */
function tique(){
  const d = new Date();
  document.getElementById('relogio').textContent =
    p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());
}
tique(); setInterval(tique, 20000);

/* ---- Estado da conexão: avisa só quando há problema ---- */
function conexao(ok){
  document.getElementById('conexao').classList.toggle('off', !ok);
  document.getElementById('conexaoTxt').textContent = ok ? '' : 'Sem conexão com o servidor';
}
window.addEventListener('offline', () => conexao(false));
window.addEventListener('online',  () => conexao(true));
if (!navigator.onLine) conexao(false);

document.getElementById('btSair').addEventListener('click', sair);

/* ---- Contador de pendências nas abas (atualizado pelo Realtime) ---- */
async function atualizarContadores(){
  try {
    const lista = await listarInstrumentos();
    const ativos = lista.filter(i => i.condicao_fisica === 'ativo');
    const vencidos = ativos.filter(i => i.status_efetivo === 'descalibrado').length;
    const proximos = ativos.filter(i => i.status_efetivo === 'proximo_vencimento').length;
    contadorNav('calibracao', vencidos || proximos, vencidos ? 'late' : 'warn');
  } catch (e){ /* silencioso: é enfeite, não função */ }
}

/* ---- Arranque ---- */
(async () => {
  const p = await exigirSessao();
  if (!p) return;

  vigiarSessao();

  try { await carregarConfig(); }
  catch (e){ toast('Não foi possível ler as configurações: ' + msgErro(e), 'error'); }

  document.getElementById('usuarioNome').textContent = p.nome || p.email;
  const elPapel = document.getElementById('usuarioPapel');
  elPapel.textContent = souAdmin() ? 'Administrador' : 'Metrologista';
  elPapel.className = 'papel' + (souAdmin() ? ' admin' : '');

  montarNav(document.getElementById('nav'), souAdmin());
  iniciarRouter(document.getElementById('tela'));

  document.getElementById('gate').hidden = true;

  atualizarContadores();
  ouvir('shell-metrologia', ['instrumentos','calibracoes'], () => atualizarContadores());
})();
</script>
</body>
</html>
