<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Entrar — Gestão de Metrologia · Perpec Oilfield Supply</title>
<link rel="stylesheet" href="style.css">
<script src="logo.js"></script>
</head>
<body>

<!-- Regra de ouro: o gate começa VISÍVEL. Nenhum dado pisca antes da identificação. -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-top">
      <img id="logo" alt="Perpec Oilfield Supply">
      <h1>Gestão de Metrologia</h1>
      <p>Controle de calibração de instrumentos</p>
    </div>

    <form class="gate-body" id="formEntrar" autocomplete="on">
      <div class="warn-box e" id="aviso" hidden></div>

      <div class="field" id="wEmail">
        <label for="fEmail">E-mail</label>
        <input type="email" id="fEmail" name="email" autocomplete="username"
               placeholder="nome.sobrenome@perpec.com.br" required>
        <div class="msg" id="mEmail"></div>
      </div>

      <div class="field" id="wSenha">
        <label for="fSenha">Senha</label>
        <input type="password" id="fSenha" name="password" autocomplete="current-password"
               placeholder="Sua senha" required>
        <div class="msg" id="mSenha"></div>
      </div>

      <button class="btn btn-red btn-xl" id="btEntrar" type="submit">ENTRAR</button>

      <p style="font-size:12px;color:var(--muted);text-align:center;line-height:1.5">
        Acesso concedido pelo administrador da Metrologia.<br>
        Esqueceu a senha? Procure quem administra o sistema.
      </p>
    </form>

    <div class="gate-foot" id="rodape">APP-MET-001</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { CONFIG } from './config.js';
import { sb, configurado } from './supabase.js';
import { entrar } from './auth.js';
import { toast, msgErro, marcarErro } from './utils.js';

document.getElementById('rodape').textContent = CONFIG.APP_REF;
document.title = 'Entrar — ' + CONFIG.APP_NOME + ' · ' + CONFIG.EMPRESA;
if (window.LOGO_B64) document.getElementById('logo').src = window.LOGO_B64;
else document.getElementById('logo').remove();

const aviso = document.getElementById('aviso');
function mostrarAviso(txt){ aviso.hidden = !txt; aviso.innerHTML = txt || ''; }

/* Instalação incompleta é erro de setup: dizer isso claramente economiza horas. */
if (!configurado()){
  mostrarAviso('<b>Sistema ainda não configurado.</b><br>' +
    'Preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> em <code>config.js</code>.');
  document.getElementById('btEntrar').disabled = true;
}

/* Já logado? Vai direto para o aplicativo. */
(async () => {
  if (!configurado()) return;
  const { data:{ session } } = await sb.auth.getSession();
  if (session) location.replace('app.html');
})();

document.getElementById('formEntrar').addEventListener('submit', async e => {
  e.preventDefault();
  const bt    = document.getElementById('btEntrar');
  const email = document.getElementById('fEmail').value.trim();
  const senha = document.getElementById('fSenha').value;

  marcarErro('Email',''); marcarErro('Senha',''); mostrarAviso('');

  let erro = false;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ marcarErro('Email','Digite um e-mail válido.'); erro = true; }
  if (senha.length < 6){ marcarErro('Senha','A senha tem pelo menos 6 caracteres.'); erro = true; }
  if (erro){ toast('Confira os campos em vermelho.','error'); return; }

  bt.disabled = true; bt.textContent = 'ENTRANDO…';
  try {
    await entrar(email, senha);
    location.replace('app.html');
  } catch (err){
    mostrarAviso('<b>Não foi possível entrar.</b><br>' + msgErro(err));
    toast(msgErro(err), 'error');
    bt.disabled = false; bt.textContent = 'ENTRAR';
  }
});
</script>
</body>
</html>
